name: Build Android APK with Kivy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Essential System Tools
      run: |
        sudo apt-get update || true
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          git \
          zip \
          unzip \
          libffi-dev \
          libssl-dev \
          python3-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip setuptools
        pip install "Cython<3.0.0"
        pip install buildozer

    - name: Accept Android Licenses & Install Build-Tools (AIDL)
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.0" "platforms;android-33" "platform-tools" || true

    - name: Build APK with Buildozer
      run: |
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec || true
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
