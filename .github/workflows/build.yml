name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev sqlite3 libsqlite3-dev libssl-dev libffi-dev libgdbm-dev build-essential libltdl-dev ccache clad gfortran

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Generate buildozer.spec and Build APK
        run: |
          # Generar archivo buildozer.spec
          buildozer init
          
          # Ajustar configuraciones necesarias
          sed -i 's/title = My Application/title = MiApp/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = miapp/g' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.miempresa/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,kivymd/g' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/# p4a.branch = master/p4a.branch = master/g' buildozer.spec

          # Compilar el APK
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
